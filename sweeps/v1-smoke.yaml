name: v1-smoke
harness: claude_code_go
model: claude-sonnet-4-6
max_samples_per_axis: 5
budget_per_sample_usd: 2.00
timeout_per_sample_s: 600
axes:
  - {id: M1, task: tasks.memory.m1_cross_window, arm: ARM-M-A}
  - {id: M2, task: tasks.memory.m2_cross_modal, arm: ARM-M-A}
  - {id: M3, task: tasks.memory.m3_stale_fact, arm: ARM-M-A}
  - {id: M4, task: tasks.memory.m4_procedural, arm: ARM-M-A}
  - {id: M5, task: tasks.memory.m5_eviction, arm: ARM-M-A}
  - {id: BS1, task: tasks.bisociation.bs1_analogy_retrieval, arm: ARM-M-A}
  - {id: FM3, task: tasks.pain_modes.fm3_condensation_loops, arm: ARM-M-A}
  - {id: FM4, task: tasks.pain_modes.fm4_kv_cache_drift, arm: ARM-M-A}
  - {id: FM5, task: tasks.pain_modes.fm5_destructive_action, arm: ARM-M-A}
output: results/v1-smoke-{timestamp}/
